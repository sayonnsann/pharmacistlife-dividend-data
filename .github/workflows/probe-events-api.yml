name: edinetdb イベントAPIの調査（手動実行のみ）

# 目的: /v1/events の dividend_revision が増配検知に使えるかを確認する調査用。
# 何も書き込まず、何もアップロードしない。読み取りだけ。
# 確認が終わったらこのファイルは削除してよい。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: APIを叩いて構造と件数を確認
        env:
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          KEY = os.environ["EDINETDB_API_KEY"]
          BASE = "https://edinetdb.jp/v1"


          def call(path, params):
              url = f"{BASE}/{path}?{urlencode(params)}"
              request = Request(url, headers={
                  "X-API-Key": KEY, "Accept": "application/json",
                  "User-Agent": "events-api-probe/1.0"})
              try:
                  with urlopen(request, timeout=60) as response:
                      return json.load(response), response.headers.get("X-RateLimit-Remaining"), None
              except HTTPError as error:
                  return None, None, f"HTTP {error.code}: {error.read().decode('utf-8','replace')[:200]}"
              except (URLError, TimeoutError) as error:
                  return None, None, f"通信失敗: {error}"


          print("### 1. 分割系の event_type が使えるか")
          found = {}
          for etype in ("split", "stock_split", "share_split", "reverse_split"):
              payload, remaining, error = call("events", {
                  "since": "2026-01-01", "until": "2026-12-31",
                  "event_type": etype, "limit": 1})
              if error:
                  print(f"  {etype}: {error[:110]}")
              else:
                  total = ((payload.get("meta") or {}).get("pagination") or {}).get("total")
                  print(f"  {etype}: total={total}  残量={remaining}")
                  found[etype] = total

          print("\n\n### 2. 分割イベントの一覧（2026年）")
          rows = []
          for etype, total in found.items():
              if not total:
                  continue
              offset = 0
              while offset < min(total, 300):
                  payload, remaining, error = call("events", {
                      "since": "2026-01-01", "until": "2026-12-31",
                      "event_type": etype, "limit": 100, "offset": offset})
                  if error:
                      print(f"  {etype} offset={offset}: {error[:110]}")
                      break
                  chunk = payload.get("data") or []
                  if not chunk:
                      break
                  for row in chunk:
                      row["_etype"] = etype
                    
                  rows.extend(chunk)
                  offset += 100
              print(f"  {etype}: {len([r for r in rows if r.get('_etype')==etype])}件を取得  残量={remaining}")

          if rows:
              print(f"\n  1件目のフィールド: {list(rows[0].keys())}")
              print("  --- 1件目 ---")
              print("  " + json.dumps(rows[0], ensure_ascii=False, indent=2).replace("\n", "\n  ")[:900])
              months = Counter(str(r.get("event_date") or "?")[:7] for r in rows)
              print(f"\n  月別の件数: {json.dumps(dict(sorted(months.items())), ensure_ascii=False)}")
              print(f"\n  --- 直近に発表された分割 30件（銘柄コード・社名・日付・種別）---")
              for row in sorted(rows, key=lambda r: str(r.get("event_date") or ""), reverse=True)[:30]:
                  meta = row.get("metadata") or {}
                  print(f"    {row.get('event_date')} {row.get('sec_code')} "
                        f"{str(row.get('filer_name'))[:18]:<18} [{row.get('_etype')}] "
                        f"{str(row.get('title'))[:44]}")

              codes = sorted({str(r.get("sec_code") or "")[:4] for r in rows if r.get("sec_code")})
              print(f"\n  ★ 分割・併合を発表した銘柄数（重複除く）: {len(codes)}")
              print("  " + " ".join(codes))
          print("\n調査終了")
          PY
