name: edinetdb イベントAPIの調査（手動実行のみ）

# 目的: /v1/events の dividend_revision が増配検知に使えるかを確認する調査用。
# 何も書き込まず、何もアップロードしない。読み取りだけ。
# 確認が終わったらこのファイルは削除してよい。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: APIを叩いて構造と件数を確認
        env:
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import date, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          KEY = os.environ["EDINETDB_API_KEY"]
          BASE = "https://edinetdb.jp/v1"


          def call(path, params):
              url = f"{BASE}/{path}?{urlencode(params)}"
              request = Request(url, headers={
                  "X-API-Key": KEY, "Accept": "application/json",
                  "User-Agent": "events-api-probe/1.0"})
              try:
                  with urlopen(request, timeout=45) as response:
                      return json.load(response), response.headers.get("X-RateLimit-Remaining"), None
              except HTTPError as error:
                  return None, None, f"HTTP {error.code}: {error.read().decode('utf-8','replace')[:300]}"
              except (URLError, TimeoutError) as error:
                  return None, None, f"通信失敗: {error}"


          today = date.today()
          print("### 東計電算 E05066 の直近2件を全フィールド表示")
          payload, remaining, error = call("companies/E05066/earnings", {"limit": 2})
          if error:
              print(f"  失敗: {error}")
          else:
              rows = (payload.get("data") or {}).get("earnings") or []
              print(f"  残量={remaining}")
              for row in rows:
                  print("\n  --- disclosure_date=" + str(row.get("disclosure_date")) + " Q" + str(row.get("quarter")) + " ---")
                  for key in sorted(row):
                      value = row[key]
                      if value is not None and key not in ("title",):
                          print(f"    {key}: {value}")
                  print(f"    title: {str(row.get('title'))[:100]}")

          print("\n\n### earnings_summary に配当の手がかりがあるか（8/3の東計電算を探す）")
          payload, remaining, error = call("events", {
              "since": "2026-08-03", "until": "2026-08-03",
              "event_type": "earnings_summary", "limit": 100})
          if error:
              print(f"  失敗: {error}")
          else:
              rows = payload.get("data") or []
              total = ((payload.get("meta") or {}).get("pagination") or {}).get("total")
              print(f"  8/3のearnings_summary: {len(rows)}件（total={total}） 残量={remaining}")
              hits = [r for r in rows if str(r.get("sec_code") or "") == "4746"]
              print(f"  東計電算のヒット: {len(hits)}件")
              for hit in hits:
                  print("  " + json.dumps(hit, ensure_ascii=False, indent=2).replace("\n", "\n  ")[:1400])

          print("\n\n### 5月中旬（決算集中期）の1日あたり件数")
          for day in ("2026-05-13", "2026-05-14", "2026-05-15"):
              for etype in ("dividend_revision", "earnings_summary"):
                  payload, remaining, error = call("events", {
                      "since": day, "until": day, "event_type": etype, "limit": 1})
                  if error:
                      print(f"  {day} {etype}: 失敗 {error[:80]}")
                  else:
                      total = ((payload.get("meta") or {}).get("pagination") or {}).get("total")
                      print(f"  {day} {etype}: total={total}  残量={remaining}")
          print("\n調査終了")
          PY
