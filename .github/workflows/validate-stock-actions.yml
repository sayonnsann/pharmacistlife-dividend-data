name: Validate stock actions PR

on:
  pull_request:
    paths:
      - data/stock_actions_extracted.json
      - scripts/filter_extracted_stock_actions.py
      - scripts/validate_stock_actions_pr.py
      - tests/**
      - .github/workflows/validate-stock-actions.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install -r scripts/requirements.txt pytest

      - name: Run all tests
        run: python -m pytest -q

      - name: Check changed files and event-count spike
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --name-only "${BASE_SHA}...${HEAD_SHA}" > "${RUNNER_TEMP}/changed-files.txt"
          git show "${BASE_SHA}:data/stock_actions_extracted.json" > "${RUNNER_TEMP}/stock_actions_base.json"
          python scripts/validate_stock_actions_pr.py \
            --base-file "${RUNNER_TEMP}/stock_actions_base.json" \
            --head-file data/stock_actions_extracted.json \
            --changed-files-file "${RUNNER_TEMP}/changed-files.txt"
