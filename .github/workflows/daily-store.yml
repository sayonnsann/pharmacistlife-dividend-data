name: 配当チェッカーDBの日次更新

on:
  schedule:
    # GitHub ActionsのcronはUTC。22:00 UTC = 翌日07:00 JST。
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-dividend-store
  cancel-in-progress: false

jobs:
  update-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      PRIORITY_CODES: ${{ secrets.PRIORITY_CODES }}
      DVC_FORECAST_DAILY: "95"
      # 増配・分割の開示を見て割り込ませる社数の上限（会社数で数える）。
      # イベント取得に使ったリクエストの分だけ、上のDVC_FORECAST_DAILYから
      # 自動的に差し引かれる。0にするとイベントAPIを一切呼ばず、
      # 決算月からの近似日だけで動く従来の挙動に戻る。
      DVC_EVENT_SLOTS: "20"
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: lftpをインストール
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: 依存ライブラリをインストール
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: 外部由来データがリポジトリに入っていないか確認
        shell: bash
        run: |
          set -euo pipefail
          # 公開してよいのはEDINET原本から作った2次資料まで。以下は外部サイト由来の
          # 値そのものを含むので、Publicのこのリポジトリには絶対に入れない。
          #   fiscal_dividends.json          … 半分近くの年が haitoukin-checker 由来
          #   haitoukin_fills.json           … haitoukin-checker 由来の配当額そのもの
          #   dividends.json                 … Yahoo(yfinance)由来＋上の補完入り（廃止済み）
          #   calendar_dividends_frozen.json … 上から切り出した14銘柄分の凍結スナップショット
          # 利用の許可はあるが再配布の許可ではない。誤ってコミットされたら
          # ここで気づけるようにする。
          tracked=0
          for path in \
            data/fiscal_dividends.json \
            data/haitoukin_fills.json \
            data/dividends.json \
            data/calendar_dividends_frozen.json
          do
            if git ls-files --error-unmatch "$path" >/dev/null 2>&1; then
              echo "::error::${path} がリポジトリに入っています。外部サイト由来のデータをPublicリポジトリに置くことはできません。git rm --cached で外してください。"
              tracked=1
            fi
          done
          if [[ "$tracked" -ne 0 ]]; then
            exit 1
          fi
          echo "外部由来データはリポジトリに入っていません。"

      - name: 非公開ファイルの一時パスを設定
        shell: bash
        run: |
          set -euo pipefail
          echo "STATE_FILE=${RUNNER_TEMP}/forecasts_state.json" >> "$GITHUB_ENV"
          echo "SQLITE_FILE=${RUNNER_TEMP}/stocks.sqlite" >> "$GITHUB_ENV"
          echo "FISCAL_FILE=${RUNNER_TEMP}/fiscal_dividends.json" >> "$GITHUB_ENV"
          echo "CALENDAR_FILE=${RUNNER_TEMP}/calendar_dividends_frozen.json" >> "$GITHUB_ENV"

      - name: FTPS設定を検証
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_HOST FTP_USER FTP_PASS FTP_REMOTE_DIR EDINETDB_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret ${name} が未設定です。"
              exit 1
            fi
          done
          if [[ "$FTP_HOST" == *"://"* || "$FTP_HOST" == */* ]]; then
            echo "::error::FTP_HOST はホスト名だけを設定してください。"
            exit 1
          fi
          if [[ "$FTP_REMOTE_DIR" != /* ]]; then
            echo "::error::FTP_REMOTE_DIR は / から始めてください。"
            exit 1
          fi

      - name: 予想stateをFTPSから取得
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR%/}"
          state_url="ftp://${FTP_HOST}${remote_dir}/forecasts_state.json"
          if curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --output "$STATE_FILE" \
            "$state_url"; then
            echo "既存の予想stateを取得しました。"
          else
            status=$?
            if [[ "$status" -eq 78 ]]; then
              rm -f "$STATE_FILE"
              echo "初回実行: 予想stateがないため空の状態から開始します。"
            else
              echo "::error::予想stateのFTPS取得に失敗しました（curl終了コード ${status}）。"
              exit "$status"
            fi
          fi

      - name: 事業年度の配当系列をFTPSから取得
        shell: bash
        run: |
          set -euo pipefail
          # このファイルはリポジトリに置けない（外部サイト由来のデータを含み、
          # このリポジトリはPublicのため）。ConoHaの非公開dataディレクトリから
          # 実行のたびに取ってきて、ランナーの一時領域だけで使う。
          remote_dir="${FTP_REMOTE_DIR%/}"
          curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --output "$FISCAL_FILE" \
            "ftp://${FTP_HOST}${remote_dir}/fiscal_dividends.json"
          # 中身がJSONとして読めるかまで確認する（途中で切れたファイルで
          # ビルドすると、配当系列が欠けたまま本番に出てしまうため）。
          python - <<'PY'
          import json
          import os
          path = os.environ["FISCAL_FILE"]
          with open(path, encoding="utf-8") as source:
              document = json.load(source)
          if not isinstance(document, dict) or len(document) < 3000:
              raise SystemExit(
                  f"事業年度の配当系列が不足しています（{type(document).__name__}, "
                  f"{len(document) if isinstance(document, dict) else 0}銘柄）"
              )
          print(f"事業年度の配当系列を取得しました: {len(document):,}銘柄")
          PY

      - name: 暦年の凍結スナップショットをFTPSから取得
        shell: bash
        run: |
          set -euo pipefail
          # EDINETにもhaitoukin-checkerにも配当の記載が無く、事業年度の系列を
          # 作れなかった銘柄（14銘柄）の配当グラフ用。Yahoo由来の値を含むので
          # リポジトリには置けない。凍結（更新しない）ファイル。
          # 無くてもビルドは通る（その14銘柄のグラフだけが空になる）ので、
          # 取得に失敗しても止めない。
          remote_dir="${FTP_REMOTE_DIR%/}"
          if curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --output "$CALENDAR_FILE" \
            "ftp://${FTP_HOST}${remote_dir}/calendar_dividends_frozen.json"
          then
            python - <<'PY'
          import json
          import os
          path = os.environ["CALENDAR_FILE"]
          with open(path, encoding="utf-8") as source:
              document = json.load(source)
          stocks = document.get("stocks") if isinstance(document, dict) else None
          if not isinstance(stocks, dict) or not stocks:
              raise SystemExit("凍結スナップショットが空です")
          print(f"暦年の凍結スナップショットを取得しました: {len(stocks):,}銘柄")
          PY
          else
            echo "::warning::凍結スナップショットを取得できませんでした。該当14銘柄の配当グラフが空になります。"
            rm -f "$CALENDAR_FILE"
          fi

      - name: 配当予想を更新
        shell: bash
        run: |
          set -euo pipefail
          log="${RUNNER_TEMP}/fetch_forecasts.log"
          python scripts/fetch_forecasts.py \
            --fiscal-dividends "$FISCAL_FILE" \
            --calendar-dividends "$CALENDAR_FILE" \
            --state "$STATE_FILE" | tee "$log"
          # 1銘柄のAPI失敗ではもう止まらない（止めるとこの後のストア構築も
          # FTPS反映も走らず、株価や利回りまで更新されなくなるため）。
          # 代わりに、まとまった数が失敗していたら実行結果の画面に出す。
          # 認証失敗のような全体障害はスクリプトが非0で終わるので、
          # 警告ではなくステップの失敗として現れる。
          summary="$(grep -m1 '^summary ' "$log" || true)"
          if [[ -z "$summary" ]]; then
            echo "::warning::配当予想の取得結果を読み取れませんでした。ログを確認してください。"
          else
            selected="$(sed -n 's/.*selected=\([0-9][0-9]*\).*/\1/p' <<<"$summary")"
            failed="$(sed -n 's/.*failed=\([0-9][0-9]*\).*/\1/p' <<<"$summary")"
            selected="${selected:-0}"
            failed="${failed:-0}"
            # 取得しようとした件数の1割を超えたら警告する。
            if (( failed > 0 && failed * 10 > selected )); then
              echo "::warning::配当予想の取得で ${selected} 件中 ${failed} 件が失敗しました。edinetdb.jp の状態とAPIキーを確認してください。"
            fi
          fi

      - name: 予想stateをFTPSへ書き戻す
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR%/}"
          lftp -u "${FTP_USER},${FTP_PASS}" \
            -e "set ssl:verify-certificate true; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
                put -O ${remote_dir}/ \"$STATE_FILE\" -o forecasts_state.json.new; \
                bye" \
            "ftp://${FTP_HOST}"
          # 実サイズ検証（申告ではなく現物を確認）
          local_size=$(wc -c < "$STATE_FILE" | tr -d ' ')
          remote_size=$(curl --ssl-reqd --silent --user "${FTP_USER}:${FTP_PASS}" --head \
            "ftp://${FTP_HOST}${remote_dir}/forecasts_state.json.new" | awk '/Content-Length/ {print $2}' | tr -d '\r')
          if [ "$local_size" != "$remote_size" ]; then
            echo "::error::forecasts_state.json のアップロード検証に失敗（local=$local_size remote=$remote_size）"
            exit 1
          fi
          lftp -u "${FTP_USER},${FTP_PASS}" \
            -e "set ssl:verify-certificate true; set ftp:ssl-force true; \
                rm -f ${remote_dir}/forecasts_state.json.bak; \
                mv ${remote_dir}/forecasts_state.json ${remote_dir}/forecasts_state.json.bak || true; \
                mv ${remote_dir}/forecasts_state.json.new ${remote_dir}/forecasts_state.json; \
                bye" \
            "ftp://${FTP_HOST}"
          echo "forecasts_state.json を検証つきで差し替えました（$local_size bytes）"

      - name: SQLiteストアを構築
        run: >-
          python scripts/build_store.py
          --forecasts "$STATE_FILE"
          --fiscal-dividends "$FISCAL_FILE"
          --calendar-dividends "$CALENDAR_FILE"
          --output "$SQLITE_FILE"

      - name: SQLiteをFTPSへ原子的に反映
        id: publish_store
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR%/}"
          lftp -u "${FTP_USER},${FTP_PASS}" \
            -e "set ssl:verify-certificate true; set ftp:ssl-force true; set ftp:ssl-protect-data true; \
                put -O ${remote_dir}/ \"$SQLITE_FILE\" -o stocks.sqlite.new; \
                bye" \
            "ftp://${FTP_HOST}"
          # 実サイズ検証（申告ではなく現物を確認）
          local_size=$(wc -c < "$SQLITE_FILE" | tr -d ' ')
          remote_size=$(curl --ssl-reqd --silent --user "${FTP_USER}:${FTP_PASS}" --head \
            "ftp://${FTP_HOST}${remote_dir}/stocks.sqlite.new" | awk '/Content-Length/ {print $2}' | tr -d '\r')
          if [ "$local_size" != "$remote_size" ]; then
            echo "::error::stocks.sqlite のアップロード検証に失敗（local=$local_size remote=$remote_size）"
            exit 1
          fi
          lftp -u "${FTP_USER},${FTP_PASS}" \
            -e "set ssl:verify-certificate true; set ftp:ssl-force true; \
                rm -f ${remote_dir}/stocks.sqlite.bak; \
                mv ${remote_dir}/stocks.sqlite ${remote_dir}/stocks.sqlite.bak || true; \
                mv ${remote_dir}/stocks.sqlite.new ${remote_dir}/stocks.sqlite; \
                bye" \
            "ftp://${FTP_HOST}"
          echo "stocks.sqlite を検証つきで差し替えました（$local_size bytes）"

      - name: 連続した取得枠切れを通知
        if: ${{ success() }}
        shell: bash
        run: |
          set -euo pipefail
          # 1日だけなら手動更新との重なりなどでも起こり得るため許容する。
          # 2日続いたら枠の使い方・APIキー・取得対象を人が確認できるよう、
          # state/DBの配信が終わった後にジョブを失敗させて通知メールを発生させる。
          alert_after_days=2
          rate_limit_days=$(python - "$STATE_FILE" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              state = json.load(source)
          block = state.get("rateLimit")
          days = block.get("consecutiveDays", 0) if isinstance(block, dict) else 0
          if isinstance(days, bool) or not isinstance(days, int) or days < 0:
              raise SystemExit("rateLimit.consecutiveDays が不正です")
          print(days)
          PY
          )
          echo "取得枠切れの連続日数: ${rate_limit_days}日"
          if (( rate_limit_days >= alert_after_days )); then
            echo "::error::取得枠切れが${rate_limit_days}日続いています。API枠の使用状況を確認してください。"
            exit 1
          fi

      - name: 分割補正のフォールバックを通知
        if: ${{ always() && steps.publish_store.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/check_split_fallback.py "$SQLITE_FILE"

      - name: 完了
        run: echo "配当チェッカーDBの日次更新が完了しました。"
