name: 配当チェッカーDBの日次更新

on:
  schedule:
    # GitHub ActionsのcronはUTC。22:00 UTC = 翌日07:00 JST。
    - cron: "0 22 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: daily-dividend-store
  cancel-in-progress: false

jobs:
  update-store:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
      PRIORITY_CODES: ${{ secrets.PRIORITY_CODES }}
      DVC_FORECAST_DAILY: "95"
      FTP_HOST: ${{ secrets.FTP_HOST }}
      FTP_USER: ${{ secrets.FTP_USER }}
      FTP_PASS: ${{ secrets.FTP_PASS }}
      FTP_REMOTE_DIR: ${{ secrets.FTP_REMOTE_DIR }}

    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 依存ライブラリをインストール
        run: python -m pip install --disable-pip-version-check -r scripts/requirements.txt

      - name: 非公開ファイルの一時パスを設定
        shell: bash
        run: |
          set -euo pipefail
          echo "STATE_FILE=${RUNNER_TEMP}/forecasts_state.json" >> "$GITHUB_ENV"
          echo "SQLITE_FILE=${RUNNER_TEMP}/stocks.sqlite" >> "$GITHUB_ENV"

      - name: FTPS設定を検証
        shell: bash
        run: |
          set -euo pipefail
          for name in FTP_HOST FTP_USER FTP_PASS FTP_REMOTE_DIR EDINETDB_API_KEY; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Secret ${name} が未設定です。"
              exit 1
            fi
          done
          if [[ "$FTP_HOST" == *"://"* || "$FTP_HOST" == */* ]]; then
            echo "::error::FTP_HOST はホスト名だけを設定してください。"
            exit 1
          fi
          if [[ "$FTP_REMOTE_DIR" != /* ]]; then
            echo "::error::FTP_REMOTE_DIR は / から始めてください。"
            exit 1
          fi

      - name: 予想stateをFTPSから取得
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR%/}"
          state_url="ftp://${FTP_HOST}${remote_dir}/forecasts_state.json"
          if curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --output "$STATE_FILE" \
            "$state_url"; then
            echo "既存の予想stateを取得しました。"
          else
            status=$?
            if [[ "$status" -eq 78 ]]; then
              rm -f "$STATE_FILE"
              echo "初回実行: 予想stateがないため空の状態から開始します。"
            else
              echo "::error::予想stateのFTPS取得に失敗しました（curl終了コード ${status}）。"
              exit "$status"
            fi
          fi

      - name: 配当予想を更新
        run: python scripts/fetch_forecasts.py --state "$STATE_FILE"

      - name: SQLiteストアを構築
        run: >-
          python scripts/build_store.py
          --forecasts "$STATE_FILE"
          --output "$SQLITE_FILE"

      - name: 予想stateをFTPSへ書き戻す
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR%/}"
          curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --upload-file "$STATE_FILE" \
            "ftp://${FTP_HOST}${remote_dir}/forecasts_state.json.new"
          curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --quote "*DELE ${remote_dir}/forecasts_state.json" \
            --quote "RNFR ${remote_dir}/forecasts_state.json.new" \
            --quote "RNTO ${remote_dir}/forecasts_state.json" \
            "ftp://${FTP_HOST}/"
          echo "予想stateを書き戻しました。"

      - name: SQLiteをFTPSへ原子的に反映
        shell: bash
        run: |
          set -euo pipefail
          remote_dir="${FTP_REMOTE_DIR%/}"
          curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --upload-file "$SQLITE_FILE" \
            "ftp://${FTP_HOST}${remote_dir}/stocks.sqlite.new"
          curl \
            --ssl-reqd \
            --fail \
            --silent \
            --show-error \
            --user "${FTP_USER}:${FTP_PASS}" \
            --quote "*DELE ${remote_dir}/stocks.sqlite" \
            --quote "RNFR ${remote_dir}/stocks.sqlite.new" \
            --quote "RNTO ${remote_dir}/stocks.sqlite" \
            "ftp://${FTP_HOST}/"
          echo "stocks.sqliteを原子的に差し替えました。"

      - name: 完了
        run: echo "配当チェッカーDBの日次更新が完了しました。"
