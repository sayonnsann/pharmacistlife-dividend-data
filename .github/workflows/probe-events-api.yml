name: edinetdb イベントAPIの調査（手動実行のみ）

# 目的: /v1/events と /v1/calendar が使えるかを1回だけ確認する調査用。
# 何も書き込まず、何もアップロードしない。読み取りだけ。
# 確認が終わったらこのファイルは削除してよい。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: APIを叩いて構造と件数を確認
        env:
          EDINETDB_API_KEY: ${{ secrets.EDINETDB_API_KEY }}
        run: |
          python - <<'PY'
          import json
          import os
          from collections import Counter
          from datetime import date, timedelta
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen

          KEY = os.environ["EDINETDB_API_KEY"]
          BASE = "https://edinetdb.jp/v1"


          def call(path, params):
              url = f"{BASE}/{path}?{urlencode(params)}"
              # キーはヘッダで送る。URLには含めない
              request = Request(
                  url,
                  headers={
                      "X-API-Key": KEY,
                      "Accept": "application/json",
                      "User-Agent": "events-api-probe/1.0",
                  },
              )
              try:
                  with urlopen(request, timeout=45) as response:
                      remaining = response.headers.get("X-RateLimit-Remaining")
                      return json.load(response), remaining, None
              except HTTPError as error:
                  body = error.read().decode("utf-8", "replace")[:400]
                  return None, None, f"HTTP {error.code}: {body}"
              except (URLError, TimeoutError) as error:
                  return None, None, f"通信失敗: {error}"
              except json.JSONDecodeError as error:
                  return None, None, f"JSONではない応答: {error}"


          def show_keys(label, obj, depth=0):
              pad = "  " * depth
              if isinstance(obj, dict):
                  print(f"{pad}{label}: dict キー={list(obj.keys())}")
              elif isinstance(obj, list):
                  print(f"{pad}{label}: list 件数={len(obj)}")
              else:
                  print(f"{pad}{label}: {type(obj).__name__}")


          def records_of(payload):
              """よくある包み方に対応して中身のリストを取り出す。"""
              if isinstance(payload, list):
                  return payload
              if isinstance(payload, dict):
                  for key in ("events", "data", "items", "results", "calendar", "records"):
                      value = payload.get(key)
                      if isinstance(value, list):
                          return value
              return []


          today = date.today()
          print(f"実行日: {today.isoformat()}")
          print("=" * 70)

          # ---------- 1. /v1/events ----------
          print("\n### /v1/events（直近7日のイベントフィード）")
          params = {
              "since": (today - timedelta(days=7)).isoformat(),
              "until": today.isoformat(),
              "limit": 100,
          }
          print(f"パラメータ: {params}")
          payload, remaining, error = call("events", params)
          if error:
              print(f"  失敗: {error}")
          else:
              show_keys("応答", payload)
              rows = records_of(payload)
              print(f"  取り出せた件数: {len(rows)}")
              if rows:
                  print(f"\n  1件目のフィールド: {list(rows[0].keys())}")
                  print("\n  --- 1件目の中身 ---")
                  print("  " + json.dumps(rows[0], ensure_ascii=False, indent=2).replace("\n", "\n  ")[:1200])
                  types = Counter(
                      str(r.get("event_type") or r.get("type") or "?") for r in rows
                  )
                  print(f"\n  event_type の分布: {dict(types)}")
                  sev = Counter(str(r.get("severity") or "?") for r in rows)
                  print(f"  severity の分布: {dict(sev)}")
                  dates = Counter(
                      str(r.get("date") or r.get("disclosure_date") or r.get("occurred_on") or "?")[:10]
                      for r in rows
                  )
                  print(f"  日付の分布: {dict(sorted(dates.items()))}")

                  # 東計電算(4746)を探す
                  hits = [
                      r for r in rows
                      if "4746" in json.dumps(r, ensure_ascii=False)
                      or "東計電算" in json.dumps(r, ensure_ascii=False)
                  ]
                  print(f"\n  ★ 東計電算(4746)のヒット: {len(hits)}件")
                  for hit in hits[:3]:
                      print("  " + json.dumps(hit, ensure_ascii=False)[:600])
              if remaining is not None:
                  print(f"\n  残量ヘッダ: {remaining}")

          # ---------- 2. 配当関連イベントだけ絞れるか ----------
          print("\n\n### /v1/events（event_type で絞る試行）")
          for event_type in ("dividend_revision", "guidance_revision", "earnings_summary"):
              payload, remaining, error = call(
                  "events",
                  {
                      "since": (today - timedelta(days=7)).isoformat(),
                      "until": today.isoformat(),
                      "event_type": event_type,
                      "limit": 100,
                  },
              )
              if error:
                  print(f"  {event_type}: 失敗 {error[:120]}")
              else:
                  rows = records_of(payload)
                  print(f"  {event_type}: {len(rows)}件  残量={remaining}")

          # ---------- 3. /v1/calendar ----------
          print("\n\n### /v1/calendar（決算発表スケジュール）")
          params = {
              "from": today.isoformat(),
              "to": (today + timedelta(days=14)).isoformat(),
              "limit": 500,
          }
          print(f"パラメータ: {params}")
          payload, remaining, error = call("calendar", params)
          if error:
              print(f"  失敗: {error}")
          else:
              show_keys("応答", payload)
              rows = records_of(payload)
              print(f"  取り出せた件数: {len(rows)}")
              if rows:
                  print(f"  1件目のフィールド: {list(rows[0].keys())}")
                  print("  --- 1件目の中身 ---")
                  print("  " + json.dumps(rows[0], ensure_ascii=False, indent=2).replace("\n", "\n  ")[:800])
                  dates = Counter(
                      str(r.get("date") or r.get("announcement_date") or "?")[:10] for r in rows
                  )
                  print(f"\n  発表予定日の分布（今日から14日）: {dict(sorted(dates.items()))}")
              if remaining is not None:
                  print(f"  残量ヘッダ: {remaining}")

          # ---------- 4. 東計電算の earnings を直接見る ----------
          print("\n\n### /v1/companies/{code}/earnings で東計電算を直接確認")
          # 4746 のEDINETコードが分からないので銘柄コードでも試す
          for code in ("4746", "E05094"):
              payload, remaining, error = call(
                  f"companies/{code}/earnings", {"limit": 3}
              )
              if error:
                  print(f"  {code}: 失敗 {error[:200]}")
              else:
                  rows = records_of(payload) or (
                      [payload] if isinstance(payload, dict) else []
                  )
                  print(f"  {code}: 取得成功 残量={remaining}")
                  print("  " + json.dumps(payload, ensure_ascii=False, indent=2).replace("\n", "\n  ")[:1500])
                  break

          print("\n" + "=" * 70)
          print("調査終了")
          PY
