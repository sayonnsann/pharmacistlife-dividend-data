<!-- 配当金推移チェッカー + EDINET財務指標（WordPressカスタムHTML向け） -->
<div id="dvc-root" class="dvc-root">
  <div class="dvc-search-box">
    <input id="dvc-search" type="text" class="dvc-search-input"
      placeholder="銘柄コードまたは銘柄名で検索(例: 7203、トヨタ)" autocomplete="off">
    <div id="dvc-suggest" class="dvc-suggest"></div>
  </div>

  <div id="dvc-detail" class="dvc-detail" style="display:none;"></div>

  <div class="dvc-ranking">
    <div class="dvc-ranking-head">
      <h3>配当・財務指標一覧</h3>
      <div class="dvc-ranking-controls">
        <label>業種で絞り込み:
          <select id="dvc-sector-filter"><option value="">すべての業種</option></select>
        </label>
        <label>配当利回り: <input id="dvc-yield-min" type="number" step="0.1" min="0" placeholder="指定なし" style="width:70px">%以上</label>
        <label>ROE:
          <input id="dvc-roe-min" type="number" step="0.1" placeholder="下限"> %以上
        </label>
        <label>自己資本比率:
          <input id="dvc-equity-min" type="number" step="0.1" placeholder="下限"> %以上
        </label>
        <label>配当性向:
          <input id="dvc-payout-max" type="number" step="0.1" placeholder="上限"> %以下
        </label>
        <button id="dvc-screen-button" type="button">絞り込む</button>
      </div>
    </div>
    <p class="dvc-sort-hint">見出しをクリックすると、APIからその並び順の最大300件を再取得します。絞り込み条件を使う場合は「絞り込む」を押してください。</p>
    <div id="dvc-table-wrap" class="dvc-table-wrap">読み込み中...</div>
    <div id="dvc-updated" class="dvc-updated"></div>
  </div>
  <p class="dvc-page-note">配当実績・財務指標はEDINET（金融庁）の開示書類を中心とした公開情報、配当予想はEDINET DB、株価はYahoo!ファイナンスに由来します。数値は各出典の更新時点・定義に基づきます。<br>予想は会社発表に基づく参考値です。</p>
</div>

  @media(max-width:760px){.dvc-chart-grid{grid-template-columns:1fr}.dvc-card-wide{grid-column:auto}.dvc-fin-head{display:block}.dvc-fin-source{display:inline-block;margin-top:8px}}

<script>
(function(){
  "use strict";
  var API_BASE="/api/api.php";
  var state={data:[],byCode:{},sort:{key:"streak",dir:"desc"},financialByCode:{},sectorStats:{},financialStatus:"loaded",currentCode:"",total:0,searchTimer:null,searchRequest:0,detailRequest:0};
  var SORTABLE_COLUMNS=[{key:"yield",label:"配当利回り"},{key:"forecast_yield",label:"予想利回り"},{key:"streak",label:"連続増配"},{key:"streak_nd",label:"連続非減配"},{key:"cagr5",label:"5年増配率"}];
  var COLORS=["#2563eb","#f59e0b","#0891b2","#059669"],SVG_W=620,SVG_H=272,PAD={top:29,right:18,bottom:43,left:62};

  function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;")}
  function fmtPct(v){return v===null||v===undefined?"-":v.toFixed(2)+"%"}
  // 数えられなかった年数(null)を「0年」と出すと、実際は増配が続いている会社を
  // 最下位に見せてしまう。分からないものは「-」にする。
  function fmtYears(v){return (typeof v==="number"&&isFinite(v))?v+"年":"-"}
  function streakNote(r){var u=r.streakUnreliable;if(!u)return"";var years=(u.breakYears||[]).join("・");return '<p class="dvc-source">連続増配年数・平均増配率は、株式分割で配当額の基準がそろっていない年'+(years?"("+esc(years)+"年)":"")+'があるため判定できません。</p>'}
  function stat(label,value){return '<div class="dvc-stat"><span class="dvc-stat-label">'+esc(label)+'</span><span class="dvc-stat-value">'+esc(value)+'</span></div>'}
  function forecastSummary(r){var details=[];if(typeof r.forecastDividend!=="number"||!isFinite(r.forecastDividend))return"";if(r.forecastPeriod)details.push(String(r.forecastPeriod));if(typeof r.forecastYield==="number"&&isFinite(r.forecastYield))details.push("予想利回り "+fmtPct(r.forecastYield));return '<div class="dvc-forecast"><span class="dvc-forecast-main">予想配当 '+esc(formatValue(r.forecastDividend,"円"))+'</span>'+(details.length?'<span class="dvc-forecast-detail">（'+esc(details.join("・"))+'）</span>':"")+"</div>"}
  function baseStreakStat(r){var base=r&&r.streakBase,total=r&&r.streakIncrease;if(typeof base!=="number"||!isFinite(base)||(typeof total==="number"&&isFinite(total)&&base===total))return"";return stat("連続増配（記念配当除き）",fmtYears(base))}
  function earningsValue(metric){var value=metric&&metric.value;return typeof value==="number"&&isFinite(value)?compactValue(value/100,"億円"):"—"}
  function earningsChange(metric){var value=metric&&metric.change;if(typeof value!=="number"||!isFinite(value))return"—";return (value>=0?"+":"")+formatNumber(value,1)+"%"}
  function earningsForecastCard(company){
    var earnings=company&&company.earnings,forecast=earnings&&earnings.forecast,metrics=forecast&&forecast.metrics,definitions=[
      ["売上高","revenue"],["営業利益","operatingIncome"],["経常利益","ordinaryIncome"],["純利益","netIncome"]
    ],hasValue;
    if(!forecast||!metrics)return"";
    hasValue=definitions.some(function(item){var metric=metrics[item[1]],value=metric&&metric.value;return typeof value==="number"&&isFinite(value)});
    if(!hasValue)return"";
    var periodType=forecast.periodType=== "next"||forecast.periodType==="current"?forecast.periodType:(forecast.sourceQuarter===4?"next":"current"),period=forecast.period?String(forecast.period):"業績予想";
    if(periodType==="next"&&!/\(予\)\s*$/.test(period))period+="(予)";
    var periodLabel=period+"・"+(periodType==="next"?"来期":"今期"),classes="dvc-card dvc-card-wide dvc-earnings-card"+(periodType==="next"?" dvc-earnings-next":"");
    return '<section class="'+classes+'"><div class="dvc-card-head"><h4>業績予想</h4><p class="dvc-earnings-subtitle">'+esc(periodLabel)+'（元データ: 百万円・表示: 億円換算）</p></div><div class="dvc-earnings-grid">'+definitions.map(function(item){var metric=metrics[item[1]]||{},changeClass=typeof metric.change==="number"&&isFinite(metric.change)?(metric.change<0?"dvc-growth-neg":"dvc-growth-pos"):"";return '<div class="dvc-earnings-metric"><span class="dvc-earnings-label">'+esc(item[0])+'</span><strong class="dvc-earnings-value">'+esc(earningsValue(metric))+'</strong><span class="dvc-earnings-change '+changeClass+'">前年比 '+esc(earningsChange(metric))+'</span></div>'}).join("")+"</div></section>"
  }
  function roeMethodNote(company){var value=company&&company.roeYearEnd,message="ROEは会社申告値（自己資本は期首期末平均）。";if(typeof value==="number"&&isFinite(value))message+="期末ベースでは "+formatNumber(value,2)+"%（IRbank等はこの方式）";return '<p class="dvc-chart-note dvc-roe-note">'+esc(message)+"</p>"}
  function validYears(data){return data?Object.keys(data).sort().filter(function(y){return typeof data[y]==="number"&&isFinite(data[y])}):[]}
  function latest(data){var ys=validYears(data);return ys.length?{year:ys[ys.length-1],value:data[ys[ys.length-1]]}:null}
  function formatNumber(v,d){return Number(v).toLocaleString("ja-JP",{minimumFractionDigits:d,maximumFractionDigits:d})}
  function digits(v){var a=Math.abs(v);return a>=100?0:a>=10?1:2}
  function formatValue(v,u){if(u==="%")return formatNumber(v,digits(v))+"%";if(u==="円")return formatNumber(v,digits(v))+"円";if(u==="億円")return formatNumber(v,Math.abs(v)<100?1:0)+"億円";return formatNumber(v,digits(v))}
  function compactValue(v,u){return u==="億円"&&Math.abs(v)>=10000?formatNumber(v/10000,1)+"兆円":formatValue(v,u)}
  function average(data){var ys=validYears(data),sum=0;if(!ys.length)return null;ys.forEach(function(y){sum+=data[y]});return sum/ys.length}
  function toOku(data){var out={};validYears(data).forEach(function(y){out[y]=data[y]/100000000});return out}
  function unionYears(series){var seen={};series.forEach(function(s){validYears(s.data).forEach(function(y){seen[y]=true})});return Object.keys(seen).sort()}
  function median(values){var a=values.slice().sort(function(x,y){return x-y}),m=Math.floor(a.length/2);return a.length%2?a[m]:(a[m-1]+a[m])/2}

  function apiURL(action,params){var query=new URLSearchParams();query.set("action",action);Object.keys(params||{}).forEach(function(key){var value=params[key];if(value!==""&&value!==null&&value!==undefined)query.set(key,value)});return API_BASE+"?"+query.toString()}
  function apiErrorMessage(err){return err&&err.rateLimited?"アクセスが集中しています。しばらくしてからお試しください":(err&&err.message?err.message:"データの読み込みに失敗しました")}
  function requestJSON(url){return fetch(url).then(function(res){return res.json().catch(function(){return{}}).then(function(body){if(!res.ok){var err=new Error(body&&body.error?body.error:"データの読み込みに失敗しました");err.rateLimited=res.status===429;throw err}return body})})}
  function renderSuggest(query){
    var box=document.getElementById("dvc-suggest"),q=query.trim(),requestId=++state.searchRequest;
    clearTimeout(state.searchTimer);
    if(!q){box.innerHTML="";box.style.display="none";return}
    if(Array.from(q).length<2){box.innerHTML='<div class="dvc-suggest-item">2文字以上入力してください</div>';box.style.display="block";return}
    state.searchTimer=setTimeout(function(){
      requestJSON(apiURL("search",{q:q})).then(function(matches){
        if(requestId!==state.searchRequest)return;
        if(!matches.length){box.innerHTML='<div class="dvc-suggest-item">該当する銘柄が見つかりません</div>';box.style.display="block";return}
        box.innerHTML=matches.map(function(r){return '<div class="dvc-suggest-item" data-code="'+esc(r.code)+'"><span>'+esc(r.name)+'</span><span class="dvc-suggest-code">'+esc(r.code)+'</span></div>'}).join("");
        box.style.display="block";
        Array.prototype.forEach.call(box.querySelectorAll(".dvc-suggest-item[data-code]"),function(el){el.addEventListener("click",function(){showDetail(el.getAttribute("data-code"),true);box.style.display="none";document.getElementById("dvc-search").value=""})})
      }).catch(function(err){if(requestId!==state.searchRequest)return;box.innerHTML='<div class="dvc-suggest-item dvc-load-error">'+esc(apiErrorMessage(err))+"</div>";box.style.display="block"})
    },300)

  }
  function card(title,subtitle,content,wide){return '<section class="dvc-card'+(wide?" dvc-card-wide":"")+'"><div class="dvc-card-head"><h4>'+esc(title)+'</h4><p class="dvc-card-subtitle">'+esc(subtitle)+"</p></div>"+content+"</section>"}
  function warningMessages(company){var messages={},split={};(company.splitSuspectYears||[]).forEach(function(y){split[String(y)]=true});(company.warnings||[]).forEach(function(w){var text=String(w),m;if(/dividendPerShare|株式分割|株式併合/.test(text)){(text.match(/(?:19|20)\d{2}/g)||[]).forEach(function(y){split[y]=true});return}m=text.match(/^([A-Za-z][A-Za-z0-9]*):/);if(m&&m[1]==="revenue")messages.revenue="売上高は、この会社の開示形式では取得できませんでした";else if(m&&m[1]==="netIncome")messages.netIncome="純利益は、この会社の開示形式では取得できませんでした";else messages.partial="一部の財務項目は、この会社の開示形式では取得できませんでした"});var years=Object.keys(split).sort(),out=Object.keys(messages).map(function(k){return{text:messages[k],split:false}});if(years.length)out.push({text:years.map(function(y){return y+"年"}).join("・")+"に株式分割・併合があった可能性があります。1株あたりの数値は、この年をまたいで単純に比較できない場合があります",split:true});return out}
  function finSummary(label,point,unit){return '<div class="dvc-fin-summary-item"><span class="dvc-fin-summary-label">'+esc(label)+'</span><span class="dvc-fin-summary-value">'+esc(point?formatValue(point.value,unit):"—")+"</span></div>"}
  function buildFinancialSection(code){
    if(state.financialStatus==="loading")return '<section class="dvc-financials"><div class="dvc-empty">財務データを読み込んでいます…</div></section>';
    if(state.financialStatus==="failed")return '<section class="dvc-financials"><div class="dvc-empty">財務データを読み込めませんでした。配当情報はそのままご利用いただけます。</div></section>';
    var c=state.financialByCode[code];if(!c)return"";
    var cash=c.cashAndEquivalents||c.cash||{},payout=validYears(c.payoutRatioTotalBased||{}).length?c.payoutRatioTotalBased:(c.payoutRatioConsolidated||{}),payoutKey=validYears(c.payoutRatioTotalBased||{}).length?"payoutRatioTotalBased":"payoutRatioConsolidated",warnings=warningMessages(c),html;
    html='<section class="dvc-financials"><div class="dvc-fin-head"><div><h3>財務指標の推移</h3><p>薄い破線は期間平均、紫の点線は業種中央値です。横軸は開示年です。</p></div><span class="dvc-fin-source">出典: EDINET（金融庁）</span></div>';
    if(warnings.length)html+='<ul class="dvc-warnings">'+warnings.map(function(w){return '<li class="'+(w.split?"dvc-warning-split":"dvc-warning-note")+'">'+esc(w.text)+"</li>"}).join("")+"</ul>";
    html+=earningsForecastCard(c);
    html+='<div class="dvc-fin-summary">'+finSummary("最新ROE",latest(c.roe||{}),"%")+finSummary("最新自己資本比率",latest(c.equityRatio||{}),"%")+finSummary("最新EPS",latest(c.eps||{}),"円")+finSummary("最新BPS",latest(c.bps||{}),"円")+"</div>"+roeMethodNote(c);
    html+='<div class="dvc-chart-grid">'+
      card("収益性","ROEとROAは別々の軸で表示",'<div class="dvc-mini-grid">'+miniMetric("ROE",c.roe||{},"%","line","#2563eb","株主のお金を使って、どれだけ利益を生んだかの割合",null,c,"roe")+miniMetric("ROA",c.roa||{},"%","line","#f59e0b","会社が持つ資産全体を使って、どれだけ利益を生んだかの割合",null,c,"roa")+"</div>",true)+
      card("安全性","自己資本比率（%）",miniMetric("自己資本比率",c.equityRatio||{},"%","line","#0891b2","総資産のうち返済不要な自己資本が占める割合",null,c,"equityRatio"),false)+
      card("1株価値","EPSとBPSは別々の軸で表示",'<div class="dvc-mini-grid">'+miniMetric("EPS",c.eps||{},"円","line","#2563eb","1株あたりの利益",null,c,"eps")+miniMetric("BPS",c.bps||{},"円","line","#0891b2","1株あたりの純資産",null,c,"bps")+"</div>",true)+
      card("規模","金額は億円換算。売上高と純利益は別々の軸で表示",'<div class="dvc-mini-grid">'+miniMetric("売上高",toOku(c.revenue||{}),"億円","bar","#2563eb","商品やサービスの提供で得た収入の規模",null,c,"revenue")+miniMetric("純利益",toOku(c.netIncome||{}),"億円","bar","#059669","税金などを差し引いた後に会社に残った利益",null,c,"netIncome")+"</div>",true)+
      card("現金と借入","現金と有利子負債比率は別々の軸で表示",'<div class="dvc-mini-grid">'+miniMetric("現金等",toOku(cash),"億円","bar","#0891b2","手元にある現金や、すぐに現金化できる資産の規模",null,c,"cashAndEquivalents")+miniMetric("有利子負債比率",c.deRatio||{},"%","line","#f59e0b","自己資本に対する借入の大きさ","有利子負債比率は、この会社の開示形式では算出できませんでした",c,"deRatio")+"</div>",true)+
      card("株主還元","配当性向・DOE・配当利回りは別々の軸で表示",'<div class="dvc-mini-grid">'+miniMetric("配当性向",payout,"%","line","#2563eb","利益のうち配当に回した割合",null,c,payoutKey)+miniMetric("DOE",c.doe||{},"%","line","#059669","純資産に対する配当の割合",null,c,"doe")+"</div>"+dividendYieldMetric(c),true)+
      "</div></section>";
    return html
  }

  function renderDetail(r,shouldScroll){
    var panel=document.getElementById("dvc-detail"),stats;
    state.currentCode=r.code;panel.style.display="block";
    stats=stat("株価(データ取得時点)",r.price?r.price.toLocaleString("ja-JP")+"円":"-")+stat("現在の配当利回り",fmtPct(r.dividendYield))+stat("予想利回り",fmtPct(typeof r.forecastYield==="number"&&isFinite(r.forecastYield)?r.forecastYield:null))+stat("連続増配年数",fmtYears(r.streakIncrease))+baseStreakStat(r)+stat("連続非減配年数",fmtYears(r.streakNonDecrease))+stat("3年平均増配率",fmtPct(r.cagr3))+stat("5年平均増配率",fmtPct(r.cagr5))+stat("10年平均増配率",fmtPct(r.cagr10));
    panel.innerHTML='<div class="dvc-detail-head"><h2>'+esc(r.name)+'</h2><span class="dvc-detail-code">'+esc(r.code)+'</span></div><div class="dvc-detail-meta">'+esc((r.market||"")+" / "+(r.sector||""))+'</div><div class="dvc-stat-grid">'+stats+"</div>"+streakNote(r)+forecastSummary(r)+'<h4>年別配当金推移(1株あたり・円)</h4>'+buildBarChart(r.annual||{},r.payoutRatio||{},r.dividendBreakdown||{},r.annualPartial||{},confirmedInfo(r),r.annualPending||{},r.dividendSeries||{})+dividendBreakdownNote(r.dividendBreakdown||{})+buildFinancialSection(r.code)+buildExternalLinks(r.code);
    Array.prototype.forEach.call(panel.querySelectorAll(".dvc-chart-wrap"),function(wrap){wrap.scrollLeft=wrap.scrollWidth});
    if(shouldScroll&&panel.scrollIntoView)panel.scrollIntoView({behavior:"smooth",block:"start"})
  }
  function showDetail(code,shouldScroll){
    var panel=document.getElementById("dvc-detail"),requestId=++state.detailRequest;state.currentCode=code;panel.style.display="block";panel.innerHTML='<div class="dvc-empty">銘柄データを読み込んでいます…</div>';
    requestJSON(apiURL("stock",{code:code})).then(function(r){if(requestId!==state.detailRequest)return;r.code=String(r.code);state.byCode[r.code]=r;state.financialByCode[r.code]=r;renderDetail(r,shouldScroll)}).catch(function(err){if(requestId!==state.detailRequest)return;panel.innerHTML='<div class="dvc-empty dvc-load-error">'+esc(apiErrorMessage(err))+"</div>"})
  }
  function buildExternalLinks(code){var c=encodeURIComponent(String(code));return '<div class="dvc-links"><p class="dvc-links-copy">2013年以前の配当推移は外部サイトで確認できます。</p><span class="dvc-links-label">この銘柄をもっと調べる:</span><a class="dvc-link" href="https://irbank.net/'+c+'/dividend" target="_blank" rel="noopener noreferrer">IR BANK</a><a class="dvc-link" href="https://nikkeiyosoku.com/stock/dividend/'+c+'/" target="_blank" rel="noopener noreferrer">投資の森</a><a class="dvc-link" href="https://finance.yahoo.co.jp/quote/'+c+'.T" target="_blank" rel="noopener noreferrer">Yahoo!ファイナンス</a></div>'}
  function toggleSort(key){if(state.sort.key===key)state.sort.dir=state.sort.dir==="asc"?"desc":"asc";else state.sort={key:key,dir:"desc"};document.getElementById("dvc-sector-filter").value="";document.getElementById("dvc-roe-min").value="";document.getElementById("dvc-equity-min").value="";document.getElementById("dvc-payout-max").value="";loadList()}
  function sortIndicator(key){return state.sort.key===key?(state.sort.dir==="asc"?" ▲":" ▼"):""}
  function buildHeadCell(col){return '<th class="dvc-sortable" data-sort-key="'+col.key+'" tabindex="0" role="button">'+col.label+sortIndicator(col.key)+"</th>"}
  function renderTable(){var html='<table class="dvc-table"><thead><tr><th>銘柄名</th><th>コード</th><th>業種</th>'+SORTABLE_COLUMNS.map(buildHeadCell).join("")+"</tr></thead><tbody>";state.data.forEach(function(r){html+='<tr data-code="'+esc(r.code)+'"><td>'+esc(r.name)+"</td><td>"+esc(r.code)+"</td><td>"+esc(r.industry||"-")+"</td><td>"+fmtPct(r.yield)+"</td><td>"+fmtPct(r.forecast_yield)+"</td><td>"+fmtYears(r.streak)+"</td><td>"+fmtYears(r.streak_nd)+"</td><td>"+fmtPct(r.cagr5)+"</td></tr>"});html+="</tbody></table>";var wrap=document.getElementById("dvc-table-wrap");wrap.innerHTML=html;Array.prototype.forEach.call(wrap.querySelectorAll("tr[data-code]"),function(tr){tr.addEventListener("click",function(){showDetail(tr.getAttribute("data-code"),true)})});Array.prototype.forEach.call(wrap.querySelectorAll("th[data-sort-key]"),function(th){var key=th.getAttribute("data-sort-key");th.addEventListener("click",function(){toggleSort(key)});th.addEventListener("keydown",function(e){if(e.key==="Enter"||e.key===" "||e.key==="Spacebar"||e.keyCode===13||e.keyCode===32){e.preventDefault();toggleSort(key)}})})}
  function showRows(rows,total,label){state.data=rows;state.total=total;renderTable();document.getElementById("dvc-updated").textContent=(label||"該当銘柄数")+": "+total+"件（最大300件表示）"}
  function showTableError(err){document.getElementById("dvc-table-wrap").innerHTML='<p class="dvc-load-error">'+esc(apiErrorMessage(err))+"</p>"}
  function loadList(){document.getElementById("dvc-table-wrap").textContent="読み込み中...";requestJSON(apiURL("list",{sort:state.sort.key,order:state.sort.dir,limit:300})).then(function(rows){showRows(rows,rows.length,"表示銘柄数")}).catch(showTableError)}
  function loadScreen(){var params={industry:document.getElementById("dvc-sector-filter").value,yield_min:document.getElementById("dvc-yield-min").value,roe_min:document.getElementById("dvc-roe-min").value,equity_min:document.getElementById("dvc-equity-min").value,payout_max:document.getElementById("dvc-payout-max").value};document.getElementById("dvc-table-wrap").textContent="絞り込み中...";requestJSON(apiURL("screen",params)).then(function(result){state.sort={key:"streak",dir:"desc"};showRows(result.rows,result.total,"条件一致")}).catch(showTableError)}
  function populateSectorFilter(){var sel=document.getElementById("dvc-sector-filter"),sectors=Object.keys(state.sectorStats).sort(function(a,b){return a.localeCompare(b,"ja")}),html='<option value="">すべての業種</option>';sectors.forEach(function(s){html+='<option value="'+esc(s)+'">'+esc(s)+"</option>"});sel.innerHTML=html}
  function init(){document.getElementById("dvc-search").addEventListener("input",function(e){renderSuggest(e.target.value)});document.addEventListener("click",function(e){if(!e.target.closest("#dvc-search")&&!e.target.closest("#dvc-suggest"))document.getElementById("dvc-suggest").style.display="none"});document.getElementById("dvc-screen-button").addEventListener("click",loadScreen);document.getElementById("dvc-sector-filter").addEventListener("change",loadScreen);loadList();requestJSON(apiURL("sectors",{})).then(function(stats){state.sectorStats=stats&&typeof stats==="object"?stats:{};populateSectorFilter();var current=state.byCode[state.currentCode];if(current&&current.annual)renderDetail(current,false)}).catch(function(err){console.warn("業種統計を読み込めませんでした",apiErrorMessage(err))})}
  init()
  // iframeで埋め込まれたときは、親の枠の高さを中身に合わせる（同一ドメインのときだけ動く）
  function fitParentFrame(){try{if(window.frameElement){var h=Math.max(document.body.scrollHeight,document.documentElement.scrollHeight);if(h>0)window.frameElement.style.height=(h+24)+"px"}}catch(e){}}
  if(window.frameElement){fitParentFrame();setInterval(fitParentFrame,400);window.addEventListener("resize",fitParentFrame)}
}());
</script>
